<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Vollflächiger Hintergrund für maskable (safe zone = mittlere 80%) -->
  <rect width="512" height="512" fill="#1c2e4a"/>
  <!-- Wippe / Hebel -->
  <rect x="96" y="248" width="320" height="16" rx="8" fill="#c8962b"/>
  <!-- Drehpunkt -->
  <polygon points="256,264 232,312 280,312" fill="#c8962b"/>
  <rect x="224" y="308" width="64" height="12" rx="4" fill="#c8962b"/>
  <!-- Linke Last -->
  <rect x="106" y="196" width="48" height="48" rx="6" fill="#fbf8f0"/>
  <line x1="130" y1="196" x2="130" y2="248" stroke="#fbf8f0" stroke-width="5" stroke-linecap="round"/>
  <!-- Rechte Kraft -->
  <rect x="358" y="204" width="48" height="48" rx="6" fill="#b84a1e"/>
  <line x1="382" y1="252" x2="382" y2="248" stroke="#b84a1e" stroke-width="5" stroke-linecap="round"/>
  <!-- Formel -->
  <text x="256" y="390" text-anchor="middle" font-family="Georgia,serif" font-size="40" fill="#c8962b" font-style="italic">F·s = F·s</text>
</svg>
