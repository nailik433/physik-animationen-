<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mission Bitti: Bit, Byte und Buchstaben</title>
<style>
:root {
  --board: #0E4634; --board-2: #0B3A2B; --copper: #D19A45; --copper-dim: rgba(209,154,69,.30);
  --silk: #F4F2E8; --paper: #FFFDF7; --ink: #1D2A25; --muted: #5A6A63; --line: #DAD6C8;
  --led: #FFCF33; --led-hot: #FFF6C2; --led-edge: #D9A100; --led-glow: rgba(255,207,51,.65);
  --led-off: #E7E4D8; --led-off-edge: #B3AE9C;
  --ok: #157F51; --ok-bg: #DDF4E7; --bad: #BF3434; --bad-bg: #FCE3E0; --note: #2F6BD8;
  --font: ui-rounded, "SF Pro Rounded", "Arial Rounded MT Bold", "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; color: var(--ink); font: 500 19px/1.5 var(--font);
  background-color: var(--board);
  background-image:
    radial-gradient(circle at 20px 20px, var(--copper-dim) 2.6px, transparent 3.2px),
    linear-gradient(90deg, transparent 19px, rgba(209,154,69,.10) 19px, rgba(209,154,69,.10) 21px, transparent 21px),
    linear-gradient(0deg, transparent 59px, rgba(209,154,69,.07) 59px, rgba(209,154,69,.07) 61px, transparent 61px);
  background-size: 80px 80px, 160px 80px, 80px 160px;
}
[hidden] { display: none !important; }
:focus-visible { outline: 3px solid var(--led); outline-offset: 3px; }
.app { max-width: 800px; margin: 0 auto; padding: 16px max(16px, env(safe-area-inset-right)) 90px max(16px, env(safe-area-inset-left)); }

/* Kopfzeile */
.bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; color: var(--silk); margin-bottom: 10px; }
.brand { font-weight: 800; font-size: 19px; display: flex; align-items: center; gap: 10px; }
.brand i { width: 14px; height: 14px; border-radius: 50%; background: var(--led); box-shadow: 0 0 10px var(--led-glow); }
.score { font-weight: 800; font-size: 16px; background: rgba(0,0,0,.25); border: 2px solid var(--copper-dim); padding: 6px 14px; border-radius: 999px; font-variant-numeric: tabular-nums; white-space: nowrap; }

/* Missionskarte: Leiterbahn mit LEDs */
.map { position: relative; display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); margin: 0 0 20px; padding: 6px 0 0; }
.map::before { content: ""; position: absolute; left: 6%; right: 6%; top: 23px; height: 4px; border-radius: 2px; background: var(--copper); opacity: .6; }
.node { position: relative; background: none; border: 0; padding: 0; color: var(--silk); font: inherit; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.node .dot { width: 36px; height: 36px; border-radius: 50%; background: #123E30; border: 3px solid var(--copper); display: grid; place-items: center; font-weight: 800; font-size: 15px; color: var(--silk); position: relative; z-index: 1; transition: background .3s, box-shadow .3s; }
.node.done .dot { background: var(--led); border-color: var(--led-edge); color: #3A2B00; box-shadow: 0 0 16px var(--led-glow); }
.node[aria-current="true"] .dot { outline: 3px solid var(--silk); outline-offset: 3px; }
.node .lbl { font-size: 13px; font-weight: 700; text-align: center; line-height: 1.15; opacity: .9; padding: 0 2px; }
@media (max-width: 640px) { .node .lbl { display: none; } .map { margin-bottom: 12px; } }

/* Levelkopf */
.lvlhead { color: var(--silk); margin: 0 0 16px; }
.lvlhead .count { font-size: 16px; font-weight: 700; color: var(--copper); margin: 0; }
.lvlhead h1 { font-size: clamp(30px, 6.4vw, 44px); line-height: 1.06; margin: 2px 0 0; font-weight: 800; letter-spacing: -.01em; text-wrap: balance; }

/* Schritte */
.step { margin: 0 0 16px; }
@keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: no-preference) { .step.new { animation: rise .35s ease-out both; } }
.panel { background: var(--paper); border-radius: 20px; padding: 18px 20px 20px; box-shadow: 0 3px 0 rgba(0,0,0,.22), 0 14px 28px rgba(0,0,0,.18); }
.panel > h2 { font-size: 23px; line-height: 1.2; margin: 0 0 4px; font-weight: 800; }
.panel > .lead { color: var(--muted); margin: 0 0 14px; }
.panel p { margin: 0 0 10px; max-width: 62ch; }

/* Bitti spricht */
.say { display: flex; gap: 12px; align-items: flex-start; }
.say .av { flex: none; width: 60px; margin-top: 2px; }
.bub { position: relative; flex: 1; background: var(--paper); border-radius: 20px; padding: 14px 18px; box-shadow: 0 3px 0 rgba(0,0,0,.22), 0 14px 28px rgba(0,0,0,.16); }
.bub::before { content: ""; position: absolute; left: -10px; top: 22px; border: 10px solid transparent; border-right-color: var(--paper); border-left: 0; }
.bub p { margin: 0 0 10px; max-width: 60ch; }
.bub p:last-child { margin-bottom: 0; }
.bub b { font-weight: 800; }
.ref { display: inline-block; background: #FFF1C7; border-radius: 6px; padding: 0 6px; font-weight: 700; }

.bitti { display: block; width: 100%; height: auto; overflow: visible; }
.bitti .ant { fill: var(--led); }
.bitti .eye { fill: var(--ink); }
.bitti .cl { fill: #3F6456; stroke: var(--ink); stroke-width: 2; }
.bitti .cl.on { fill: var(--led); }
@media (prefers-reduced-motion: no-preference) {
  .bitti .ant { animation: blink 2.4s infinite; }
  @keyframes blink { 0%, 70%, 100% { opacity: 1; } 80% { opacity: .25; } }
}

/* Merke */
.merke { margin-top: 14px; background-color: #fff; border: 2.5px solid var(--note); border-radius: 14px; padding: 12px 18px 12px 18px;
  background-image: repeating-linear-gradient(transparent 0 30px, rgba(47,107,216,.10) 30px 31px); }
.merke h3 { margin: 0 0 2px; font-size: 18px; color: var(--note); font-weight: 800; }
.merke p { margin: 0 0 4px; font-weight: 700; }
.fact { margin-top: 10px; font-size: 16px; color: var(--muted); }

/* LEDs */
.leds { display: flex; gap: clamp(5px, 1.6vw, 12px); }
.cell { display: flex; flex-direction: column; align-items: center; gap: 6px; flex: 1 1 0; max-width: 76px; min-width: 0; }
.wcard { width: 100%; background: #fff; border: 2px solid var(--ink); border-radius: 8px; text-align: center; font-weight: 800; font-size: clamp(13px, 3.4vw, 19px); padding: 1px 0; font-variant-numeric: tabular-nums; }
.led { width: 100%; aspect-ratio: 1; border-radius: 50%; border: 3px solid var(--led-off-edge); padding: 0; font: inherit; font-weight: 800; font-size: clamp(16px, 4.4vw, 28px); color: var(--muted);
  background: radial-gradient(circle at 34% 30%, #fff 0 10%, var(--led-off) 42%, #D9D5C6 100%);
  display: grid; place-items: center; transition: background .15s, box-shadow .2s, transform .1s; }
button.led { cursor: pointer; touch-action: manipulation; }
button.led:active { transform: scale(.92); }
.led.on { background: radial-gradient(circle at 34% 30%, var(--led-hot) 0 14%, var(--led) 50%, #F0AE00 100%); border-color: var(--led-edge); color: #4A3600;
  box-shadow: 0 0 0 4px rgba(255,207,51,.28), 0 0 26px var(--led-glow); }
.bitv { font-weight: 800; font-size: clamp(13px, 3.2vw, 16px); color: var(--ok); min-height: 1.3em; font-variant-numeric: tabular-nums; }
.leds.small .cell { max-width: 40px; }
.leds.small .led { border-width: 2px; font-size: 14px; }
.ledbox { padding: 16px; border-radius: 16px; background: #F3F0E4; border: 2px solid var(--line); }
.sumline { margin-top: 12px; font-weight: 800; font-size: clamp(20px, 4.8vw, 26px); font-variant-numeric: tabular-nums; min-height: 1.4em; overflow-wrap: anywhere; }
.sumline small { font-size: 16px; color: var(--muted); font-weight: 700; }

/* Knöpfe */
.btn { font: inherit; font-weight: 800; font-size: 18px; border-radius: 14px; padding: 9px 18px; min-height: 48px; border: 2.5px solid var(--ink); background: #fff; color: var(--ink); cursor: pointer; box-shadow: 0 3px 0 var(--ink); touch-action: manipulation; }
.btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
.btn.go { background: var(--led); border-color: #3A2B00; color: #2B2000; box-shadow: 0 3px 0 #3A2B00; }
.btn.quiet { border-color: var(--line); box-shadow: 0 3px 0 var(--line); color: var(--muted); }
.btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }
.row { display: flex; flex-wrap: wrap; gap: 10px 12px; align-items: center; margin-top: 14px; }
.nextrow { display: flex; justify-content: flex-end; gap: 10px 14px; align-items: center; margin: 4px 0 26px; color: var(--silk); flex-wrap: wrap; }
.nextrow .why { font-size: 16px; font-weight: 700; opacity: .9; }

/* Rückmeldung */
.msg { font-weight: 800; min-height: 1.5em; margin-top: 10px; }
.msg.good { color: var(--ok); }
.msg.bad { color: var(--bad); }
.goal { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; margin-bottom: 12px; }
.goal .big { font-size: 40px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
.pips { display: flex; gap: 6px; }
.pips i { width: 14px; height: 14px; border-radius: 50%; background: var(--led-off); border: 2px solid var(--led-off-edge); }
.pips i.on { background: var(--led); border-color: var(--led-edge); }

/* Tafel mit x2 */
.tafel { display: flex; gap: clamp(4px, 1.4vw, 10px); flex-wrap: nowrap; align-items: center; overflow-x: auto; padding-bottom: 4px; }
.tafel .tc { flex: 1 1 0; min-width: 34px; max-width: 72px; text-align: center; background: #fff; border: 2px solid var(--ink); border-radius: 8px; font-weight: 800; font-size: clamp(14px, 3.6vw, 20px); padding: 4px 0; }
.tafel .x2 { flex: none; font-size: 13px; font-weight: 800; color: var(--copper); }

/* Muster-Sammler */
.found { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.chip { display: flex; gap: 4px; padding: 7px 9px; border-radius: 12px; background: #fff; border: 2px solid var(--line); }
.chip i { width: 18px; height: 18px; border-radius: 50%; background: var(--led-off); border: 2px solid var(--led-off-edge); }
.chip i.on { background: var(--led); border-color: var(--led-edge); box-shadow: 0 0 6px var(--led-glow); }
.chip.empty { border-style: dashed; background: transparent; }
.chip.empty i { opacity: .25; }
.chip.flash { border-color: var(--ok); background: var(--ok-bg); }

/* Leiter: Verdoppeln */
.ladder { display: grid; gap: 8px; margin-top: 6px; }
.rung { display: grid; grid-template-columns: 7.5em 1fr auto; gap: 12px; align-items: center; }
.rung .lab { font-weight: 800; }
.rung .bar { height: 26px; border-radius: 8px; background: var(--led); border: 2px solid var(--led-edge); min-width: 8px; }
.rung .num { font-weight: 800; font-variant-numeric: tabular-nums; min-width: 3ch; text-align: right; }
.rung .x { color: var(--copper); font-weight: 800; font-size: 15px; }
.rung.q .bar { background: repeating-linear-gradient(45deg, #F3F0E4, #F3F0E4 6px, #fff 6px, #fff 12px); border-style: dashed; border-color: var(--led-off-edge); }

/* Sitzplätze */
.stepper { display: inline-flex; align-items: center; gap: 10px; }
.stepper button { width: 48px; height: 48px; border-radius: 50%; border: 2.5px solid var(--ink); background: #fff; font: 800 26px/1 var(--font); cursor: pointer; padding: 0; color: var(--ink); }
.stepper button:disabled { opacity: .3; }
.stepper output { font-weight: 800; font-size: 22px; min-width: 6ch; text-align: center; }
.seats { display: grid; grid-template-columns: repeat(auto-fill, minmax(36px, 1fr)); gap: 5px; margin-top: 12px; }
.seat { aspect-ratio: 1; border-radius: 9px; border: 2px dashed var(--led-off-edge); display: grid; place-items: center; font-weight: 800; font-size: 16px; color: var(--muted); background: #fff; }
.seat.taken { background: var(--ok-bg); border: 2px solid var(--ok); color: var(--ok); }
.outside { margin-top: 12px; padding: 10px 12px; border-radius: 14px; background: var(--bad-bg); border: 2px solid var(--bad); }
.outside h4 { margin: 0 0 8px; color: var(--bad); font-size: 17px; }
.outside .seats { margin-top: 0; }
.outside .seat { background: #fff; border: 2px solid var(--bad); color: var(--bad); }
.verdict { margin-top: 12px; font-weight: 800; padding: 10px 14px; border-radius: 12px; }
.verdict.good { background: var(--ok-bg); color: var(--ok); }
.verdict.bad { background: var(--bad-bg); color: var(--bad); }

/* Code-Automat */
.machine { display: flex; flex-wrap: wrap; gap: 16px 22px; align-items: center; }
.machine .ledbox { flex: 1 1 300px; }
.letter { flex: 0 0 auto; width: 132px; text-align: center; border: 3px solid var(--ink); border-radius: 18px; background: #fff; padding: 8px 6px 10px; }
.letter .big { font-size: 76px; font-weight: 800; line-height: 1.05; }
.letter .big.none { color: var(--line); }
.letter .cap { font-size: 15px; color: var(--muted); font-weight: 700; }
.abc { display: grid; grid-template-columns: repeat(auto-fill, minmax(50px, 1fr)); gap: 6px; margin-top: 14px; }
.abc button { font: inherit; border: 2px solid var(--line); border-radius: 10px; background: #fff; cursor: pointer; padding: 4px 0 3px; color: var(--ink); line-height: 1.1; touch-action: manipulation; }
.abc button b { display: block; font-size: 20px; }
.abc button small { font-size: 12px; color: var(--muted); font-weight: 700; }
.abc button[aria-pressed="true"] { border-color: var(--led-edge); background: #FFF1C7; }
details.spick { margin-top: 14px; border: 2px solid var(--line); border-radius: 14px; padding: 4px 14px; background: #fff; }
details.spick summary { cursor: pointer; font-weight: 800; padding: 8px 0; min-height: 44px; display: flex; align-items: center; }
.ctab { display: grid; grid-template-columns: repeat(2, 1fr); grid-template-rows: repeat(13, auto); grid-auto-flow: column; gap: 2px 18px; padding: 4px 0 10px; font-variant-numeric: tabular-nums; }
.ctab div { display: grid; grid-template-columns: 1.6em 2.2em 1fr; gap: 4px; font-size: 17px; padding: 2px 4px; border-radius: 6px; }
.ctab div.z { background: #F6F3E9; }
.ctab span:first-child { font-weight: 800; }
.ctab span:nth-child(2) { color: var(--muted); }
.ctab span:last-child { letter-spacing: .08em; font-weight: 700; }
@media (max-width: 480px) { .ctab { grid-template-columns: 1fr; grid-template-rows: none; grid-auto-flow: row; } .ctab div.z { background: none; } .ctab div:nth-child(odd) { background: #F6F3E9; } }

/* Aufgaben */
.qa { background: var(--paper); border-radius: 20px; padding: 16px 20px 18px; border: 3px solid transparent; box-shadow: 0 3px 0 rgba(0,0,0,.22), 0 14px 28px rgba(0,0,0,.18); }
.qa.done { border-color: var(--ok); }
.qa .qh { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 4px; }
.qa .qn { font-weight: 800; font-size: 16px; color: #fff; background: var(--ink); border-radius: 999px; padding: 2px 12px; }
.qa.extra .qn { background: var(--copper); }
.qa .pts { font-weight: 800; font-size: 15px; color: var(--muted); font-variant-numeric: tabular-nums; }
.qa .qt { font-weight: 800; font-size: 21px; line-height: 1.3; margin: 6px 0 6px; max-width: 60ch; }
.qa .qsub { color: var(--muted); margin: 0 0 8px; }
.qa .qsub ol { margin: 4px 0 0; padding-left: 1.3em; }
.gline { margin: 4px 0; line-height: 2.6; font-weight: 700; }
.gline.given { color: var(--muted); }
.gap { font: inherit; font-weight: 800; font-size: 20px; width: 4.6em; padding: 4px 8px; border: 2.5px solid var(--led-off-edge); border-radius: 10px; background: #fff; color: var(--ink); margin: 0 4px; text-align: center; min-height: 46px; text-transform: uppercase; font-variant-numeric: tabular-nums; }
.gap.wide { width: 6.4em; letter-spacing: .06em; }
select.gap { width: auto; text-transform: none; text-align: left; }
.gap.ok { border-color: var(--ok); background: var(--ok-bg); }
.gap.no { border-color: var(--bad); background: var(--bad-bg); }
.gap.shown { border-style: dashed; }
.opt { display: flex; gap: 12px; align-items: center; padding: 10px 14px; border: 2.5px solid var(--line); border-radius: 14px; margin: 8px 0; cursor: pointer; min-height: 50px; max-width: 600px; background: #fff; font-weight: 700; }
.opt input { width: 24px; height: 24px; accent-color: var(--ink); flex: none; margin: 0; }
.opt.ok { border-color: var(--ok); background: var(--ok-bg); }
.opt.no { border-color: var(--bad); background: var(--bad-bg); }
.plabel { display: block; font-weight: 800; margin: 12px 0 4px; }
.ptext { font: inherit; font-weight: 800; font-size: 20px; padding: 8px 12px; border: 2.5px solid var(--led-off-edge); border-radius: 12px; background: #fff; color: var(--ink); width: min(100%, 480px); letter-spacing: .04em; }
.ptext.ok { border-color: var(--ok); background: var(--ok-bg); }
.codeline { font-weight: 800; letter-spacing: .1em; font-variant-numeric: tabular-nums; }

/* Start */
.hero { display: grid; grid-template-columns: 170px 1fr; gap: 10px 26px; align-items: center; color: var(--silk); margin: 10px 0 22px; }
.hero h1 { font-size: clamp(40px, 9vw, 64px); line-height: .98; margin: 0 0 10px; font-weight: 800; letter-spacing: -.02em; }
.hero p { margin: 0 0 8px; font-size: 20px; max-width: 34ch; }
.hero .bot { filter: drop-shadow(0 0 24px rgba(255,207,51,.25)); }
@media (max-width: 560px) { .hero { grid-template-columns: 1fr; text-align: left; } .hero .bot { width: 130px; } }
.steps-how { margin: 0; padding-left: 1.3em; }
.steps-how li { margin: 4px 0; }

/* Abgabe */
.sumgrid { display: grid; gap: 6px; margin: 8px 0 4px; }
.sumrow { display: grid; grid-template-columns: 22px 1fr auto; gap: 10px; align-items: center; padding: 6px 4px; border-bottom: 1.5px solid var(--line); }
.sumrow i { width: 18px; height: 18px; border-radius: 50%; background: var(--led-off); border: 2px solid var(--led-off-edge); }
.sumrow i.on { background: var(--led); border-color: var(--led-edge); box-shadow: 0 0 8px var(--led-glow); }
.sumrow i.half { background: linear-gradient(90deg, var(--led) 50%, var(--led-off) 50%); border-color: var(--led-edge); }
.sumrow .p { font-weight: 800; font-variant-numeric: tabular-nums; }
.sumrow.x { color: var(--muted); }
.total { font-size: 30px; font-weight: 800; margin: 10px 0 0; font-variant-numeric: tabular-nums; }
.confirm { margin-top: 14px; border: 2.5px solid var(--ink); background: #FFF1C7; border-radius: 14px; padding: 12px 16px; font-weight: 700; }
.sol { margin: 6px 0; }

/* Konfetti */
.spark { position: fixed; width: 10px; height: 10px; border-radius: 3px; pointer-events: none; z-index: 50; animation: fly .95s cubic-bezier(.2,.7,.3,1) forwards; }
@keyframes fly { to { transform: translate(var(--dx), var(--dy)) rotate(var(--r)); opacity: 0; } }
</style>
</head>
<body>
<div class="app">
  <header class="bar"><div class="brand"><i></i>Mission Bitti</div><div class="score" id="score"></div></header>
  <nav class="map" id="map" aria-label="Missionskarte"></nav>
  <main id="main"></main>
</div>
<script>
const PlatformState = {
  load(callback) {
    let done = false;
    const finish = s => { if (!done) { done = true; callback(s); } };
    addEventListener('message', e => {
      if (e.source === parent && e.data && e.data.type === 'lesson_state') finish(e.data.state);
    });
    parent.postMessage({type: 'lesson_state_request'}, '*');
    setTimeout(() => finish(null), 1500);   // keine Antwort (z. B. Vorschau) = neu beginnen
  },
  save(state, progress) { parent.postMessage({type: 'lesson_state_save', state, progress}, '*'); },
  result(r) { parent.postMessage(Object.assign({type: 'lesson_result'}, r), '*'); }
};
(function () {
'use strict';
var L = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';

function $$(s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); }
function pad(v, n) { var s = v.toString(2); while (s.length < n) s = '0' + s; return s; }
function h(tag, props) {

  for (var k in props) {
    var v = props[k];

    else if (v === true) e.setAttribute(k, '');
    else e.setAttribute(k, v);
  }
  for (var i = 2; i < arguments.length; i++) {
    var c = arguments[i];
    if (c == null || c === false) continue;
    if (Array.isArray(c)) { c.forEach(function (x) { if (x) e.appendChild(x.nodeType ? x : document.createTextNode(x)); }); continue; }
    e.appendChild(c.nodeType ? c : document.createTextNode(c));
  }
  return e;
}
var timers = [];
function every(fn, ms) { timers.push(setInterval(fn, ms)); }
function later(fn, ms) { timers.push(setTimeout(fn, ms)); }
function clearTimers() { timers.forEach(function (t) { clearInterval(t); clearTimeout(t); }); timers = []; }

function burst(el, many) {
  if (RM || !el) return;
  var r = el.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + Math.min(r.height / 2, 80);

  var pnl = panel('Deine Punkte', null, grid, h('div', { class: 'total', text: tt.p + ' von ' + MAX + ' Punkten' + (tt.x ? ' + ' + tt.x + ' Extrapunkte' : '') }));
  if (!S.submitted) { pnl.appendChild(actions); pnl.appendChild(confirm); }
  else { done.hidden = false; done.textContent = 'Abgegeben. Vergleiche jetzt mit den Lösungen.'; pnl.appendChild(done); sol.hidden = false; }
  wrap.appendChild(pnl);
  TASKS.forEach(function (t) { sol.appendChild(h('p', { class: 'sol' }, h('b', { text: (t.extra ? 'Profi ' : 'Aufgabe ') + t.nr + ': ' }), solutionText(t))); });
  wrap.appendChild(h('div', { style: 'height:16px' }));
  if (S.submitted) wrap.appendChild(panel('Lösungen zum Vergleichen', 'Was du nicht verstehst, klären wir gleich bei der Sicherung.', sol));
  return wrap;
}
function solutionText(t) {
  if (t.type === 'choice') return t.options[t.correct];
  if (t.type === 'multi') return t.good.map(function (i) { return t.options[i]; }).join(', ');
  if (t.type === 'partner') return 'individuell, zum Beispiel 01000 00001 01100 01100 01111 = HALLO';
  return t.lines.filter(function (l) { return /\{\d+\}/.test(l); }).map(function (l) { return l.replace(/<[^>]+>/g, '').replace(/\{(\d+)\}/g, function (_, k) { return t.ans[+k]; }); }).join('  |  ');
}
function gapLabel(t, k) {
  var line = ''; t.lines.forEach(function (l) { if (l.indexOf('{' + k + '}') >= 0) line = l; });
  return line.replace(/<[^>]+>/g, '').replace('{' + k + '}', '?').replace(/\{\d+\}/g, '…').replace(/\s+/g, ' ').trim();
}
function taskStatus(t) {
  var o = S.t[t.id], m = itemsOf(t), pts = points(t), shown = o.shown.some(Boolean);
  if (!o.tries && !shown) return 'offen';
  if (pts === m) return o.tries > 1 ? 'richtig (' + o.tries + '. Versuch)' : 'richtig';
  if (t.type === 'gaps') {
    var wrong = [];
    for (var k = 0; k < m; k++) if (!o.ok[k] && !o.shown[k] && o.v[k]) wrong.push(gapLabel(t, k) + ' → ' + String(o.v[k]).trim());
    var s = pts + '/' + m + ' richtig';
    if (shown) s += ', Lösung angezeigt';
    if (wrong.length) s += ' (falsch: ' + wrong.join('; ') + ')';
    return s.slice(0, 160);
  }
  if (shown) return 'Lösung angezeigt';
  if (t.type === 'choice') return 'falsch (Antwort: ' + (o.v[0] != null ? t.options[o.v[0]] : '–') + ')';
  if (t.type === 'multi') return 'falsch (gewählt: ' + (o.v[0] || []).map(function (i) { return t.options[i]; }).join(', ') + ')';
  return 'noch nicht passend';
}
function gateCount() {
  var all = 0, done = 0;
  LV.forEach(function (lv) { lv.steps.forEach(function (st, i) { if (st.gate) { all++; if (S.g[lv.id + ':' + i]) done++; } }); });
  return { all: all, done: done };
}
function progress() {
  if (S.submitted) return 100;
  var units = 0, done = 0;
  LV.forEach(function (lv) {
    lv.steps.forEach(function (st, i) {
      if (st.task && TBY[st.task].extra) return;
      if (st.task || st.gate) { units++; if (stepOk(lv, i)) done++; }
    });
  });
  return Math.min(99, Math.round(done / units * 100));
}
function detail() {
  var d = {};
  TASKS.forEach(function (t) { d[(t.extra ? 'Profi ' : 'Aufgabe ') + t.nr + ' – ' + t.short] = taskStatus(t); });
  var g = gateCount();
  d['Erkunden (Ausprobier-Stationen)'] = g.done + ' von ' + g.all + ' geschafft';
  d['Zuletzt im Level'] = LV[S.cur].map;
  d['Zeit (s)'] = S.sec;
  return d;
}
function sendResult(completed) {
  if (S.submitted && !completed) return;
  var tt = totals();
  try { PlatformState.result({ score: tt.p, max: MAX, completed: !!completed, extra: tt.x, extra_max: XMAX, detail: detail() }); } catch (e) {}
}

/* ---------- Ablauf ---------- */
var main = $('#main'), nextRow = null;
function revealed(lv) { return Math.min(S.rev[lv.id] || 1, lv.steps.length); }
function stepOk(lv, i) { var st = lv.steps[i]; if (st.task) return complete(TBY[st.task]); if (st.gate) return !!S.g[lv.id + ':' + i]; return true; }
function levelDone(lv) {
  if (lv.id === 'start') return (S.rev.start || 0) >= 2;
  if (lv.id === 'abgabe') return !!S.submitted;
  if (revealed(lv) < lv.steps.length) return false;
  for (var i = 0; i < lv.steps.length; i++) if (!stepOk(lv, i)) return false;
  return true;
}
function stepEl(lv, i, isNew) {
  var st = lv.steps[i], key = lv.id + ':' + i;
  var ctx = { key: key, isDone: !!S.g[key], w: S.w[key] || (S.w[key] = {}), done: function () { if (!S.g[key]) { S.g[key] = true; save(); } refreshNext(); } };
  var sec = h('section', { class: 'step' + (isNew ? ' new' : ''), id: 'step-' + i });
  sec.appendChild(st.task ? taskEl(st.task) : st.build(ctx));
  return sec;
}
function render() {
  clearTimers();
  var lv = LV[S.cur]; main.textContent = '';
  if (lv.id !== 'start') main.appendChild(h('div', { class: 'lvlhead' }, h('p', { class: 'count', text: lv.id === 'bonus' ? 'Extra-Level' : (lv.id === 'abgabe' ? 'Ziel' : 'Level ' + S.cur + ' von 5') }), h('h1', { text: lv.title })));
  var n = revealed(lv);
  for (var i = 0; i < n; i++) main.appendChild(stepEl(lv, i, false));
  nextRow = h('div', { class: 'nextrow' }); main.appendChild(nextRow);
  refreshNext();
}
function refreshNext() {

  if (more) label = 'Weiter';
  else if (S.cur < LV.length - 1) label = lv.id === 'start' ? 'Mission starten' : (lv.id === 'code' ? 'Zu den Profi-Aufgaben' : (lv.id === 'bonus' ? 'Zur Abgabe' : 'Weiter zu: ' + LV[S.cur + 1].title));
  if (label) {
    if (!ok) nextRow.appendChild(h('span', { class: 'why', text: lv.steps[last].task ? 'Prüf zuerst die Aufgabe.' : (lv.steps[last].why || 'Schaff zuerst die Aufgabe oben.') }));
    if (lv.id === 'code' && !more) {
      var ab = h('button', { type: 'button', class: 'btn', text: 'Direkt zur Abgabe' });
      ab.addEventListener('click', function () { goLevel(LV.length - 1); });
      nextRow.appendChild(ab);
    }
    var b = h('button', { type: 'button', class: 'btn go', text: label });
    b.disabled = !ok;
    b.addEventListener('click', function () {
      if (more) {
        S.rev[lv.id] = n + 1; save();
        var el = stepEl(lv, n, true); main.insertBefore(el, nextRow); refreshNext();
        try { el.scrollIntoView({ behavior: RM ? 'auto' : 'smooth', block: 'start' }); } catch (e) { el.scrollIntoView(); }
      } else {
        if (lv.id === 'start') { S.rev.start = 2; }
        goLevel(S.cur + 1);
      }
    });
    nextRow.appendChild(b);
  }
  renderMap(); updateScore();
}
function onProgress() { refreshNext(); }
function goLevel(i) { S.cur = Math.max(0, Math.min(LV.length - 1, i)); render(); save(); window.scrollTo(0, 0); }
function renderMap() {
  var map = $('#map'); map.textContent = '';
  LV.forEach(function (lv, i) {
    var b = h('button', { type: 'button', class: 'node' + (levelDone(lv) ? ' done' : ''), 'aria-current': i === S.cur ? 'true' : 'false', 'aria-label': lv.map + (levelDone(lv) ? ', erledigt' : '') },
      h('span', { class: 'dot', text: lv.id === 'start' ? '▶' : (lv.id === 'abgabe' ? '★' : (lv.id === 'bonus' ? '+' : String(i))) }), h('span', { class: 'lbl', text: lv.map }));
    b.addEventListener('click', function () { if (lv.id === 'start' || i !== S.cur) goLevel(i); });
    map.appendChild(b);
  });
}
function updateScore() { var tt = totals(); $('#score').textContent = tt.p + ' / ' + MAX + ' Punkte' + (tt.x ? ' + ' + tt.x : ''); }

main.appendChild(h('div', { class: 'panel' }, h('p', { style: 'margin:0;font-weight:800', text: 'Mission wird geladen …' })));
PlatformState.load(function (st) {
  if (st && typeof st === 'object' && st.t && typeof st.t === 'object') S = st;
  ['rev', 'g', 't', 'w'].forEach(function (k) { if (!S[k] || typeof S[k] !== 'object') S[k] = {}; });
  if (typeof S.cur !== 'number' || !LV[S.cur]) S.cur = 0;
  S.sec = +S.sec || 0; S.submitted = !!S.submitted; S.v = 1;
  normalize();
  ready = true;
  render();
  save();
  setInterval(function () {
    if (document.visibilityState === 'hidden') return;
    S.sec++;
    if (S.sec % 30 === 0) save();
  }, 1000);
});
})();
</script>
